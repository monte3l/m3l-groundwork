# ScanCode project settings. Paths are matched with shell-style wildcards.
# Ignore only files that name a license without being licensed under it, or
# whose license ScanCode cannot know. Never ignore a path to hide a finding.
ignored_patterns:
  # The license texts themselves.
  - "LICENSES/*"
  # License ids as data: REUSE.toml records them, and dependency-review.yml
  # lists the allowed ones.
  - "REUSE.toml"
  - ".github/workflows/dependency-review.yml"
  - "workflow-templates/dependency-review.yml"
  # m3l-design's brand assets declare LicenseRef-MONTE3L-Brand, a custom
  # license ScanCode reports as unknown. `reuse lint` already checks that each
  # file declares it. A repository that does not vendor m3l-design can drop
  # this line.
  - "design/source/brand/*"
  # SECURITY.md names the licenses of dependencies in its accepted-findings
  # table. templates/ is the payload this CLI emits: the dependency-review
  # copy lists allowed licenses, and the licensing and publishing packs declare
  # NOASSERTION as their license on purpose, so a bootstrapped project does not
  # inherit this repository's license.
  - "SECURITY.md"
  - "templates/core/.github/workflows/dependency-review.yml"
  - "templates/packs/licensing/files/*"
  - "templates/packs/publishing/files/*"
