# REUSE Software (https://reuse.software) annotations for files that cannot,
# or by this project's own convention should not, carry an inline SPDX
# header -- see CLAUDE.md's "Definition of Done" for the header this repo
# expects on every other tracked file, and `bin/check-license-headers.mjs`
# for the gate that gap-checks this file's globs against that expectation.
version = 1
SPDX-PackageName = "m3l-groundwork"
SPDX-PackageSupplier = "Enrico Lionello"
SPDX-PackageDownloadLocation = "https://github.com/monte3l/m3l-groundwork"

# templates/** is THE BASELINE this CLI emits into other people's projects
# (see CLAUDE.md's "Repository Layout"), not this repo's own source -- it
# deliberately carries no inline SPDX header, so a bootstrapped project never
# ships this repo's own copyright line as if it were the new project's own.
# This annotation records the license this repo's own copy of that payload
# is under; it says nothing about what a bootstrapped project's files are
# licensed as afterward -- that's the new project owner's own choice.
[[annotations]]
path = ["templates/**"]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# design/**/*.json and design/**/*.md are already covered by the generic
# json/md annotation below with the same values, so only CSS -- this repo's
# first tracked CSS -- needs its own entry here. design/source/** is
# vendored, verbatim, from an m3l-design release (see
# design/README.md for its provenance: repository, tag, date synced);
# its content is the same person's own design system as this repo (see
# design/README.md), licensed the same way as the rest of this repo. The two
# vendored Google Fonts font files are a separate case, annotated below:
# they are not this repo's own copyright, and ship under their own upstream
# license.
[[annotations]]
path = ["design/**/*.css"]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["design/source/fonts/**"]
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The two OFL license texts as Google Fonts ships them alongside the font
# files (see design/source/fonts/** above) -- kept in their original,
# per-font location rather than moved into LICENSES/, since that is how a
# re-sync from Google Fonts (design/README.md) would overwrite them again.
[[annotations]]
path = ["design/source/licenses/**"]
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# .jsonc supports its own `//` comments (see the file itself), but the
# license-headers gate's extension list (bin/check-license-headers.mjs) only
# recognizes .json, not .jsonc, so it still needs a REUSE annotation the same
# way **/*.json below covers plain JSON.
[[annotations]]
path = ["tools/deploy/*.jsonc"]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# Everything else with no comment syntax of its own to carry a header in:
# data files, prose, and dotfiles.
[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "pnpm-lock.yaml",
  ".node-version",
  ".npmrc",
  ".gitignore",
  ".gitattributes",
  ".editorconfig",
  ".prettierignore",
  "LICENSE",
  "REUSE.toml",
  "LICENSES/**",
  ".gitleaks.toml",
  ".github/CODEOWNERS",
]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# Files whose own text mentions the SPDX tag. `reuse lint` reads
# `SPDX-License-Identifier:` anywhere in a file, so a regex, a template string
# or a sentence about the header reads as a (malformed) real tag, and the file
# then counts as unlicensed. `precedence = "override"` makes this annotation
# win over whatever the file's own text says, which is what is wanted: the
# license is not in doubt, only what the parser thinks it found. Paths are
# listed, not globbed, so a new file never picks this up by accident.
[[annotations]]
path = [
  ".bestpractices.json",
  "CLAUDE.md",
  ".claude/rules/definition-of-done.md",
  "bin/check-license-headers.mjs",
  "packages/cli/tests/packs.test.ts",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# The `publishing` and `licensing` packs' files ship with `SPDX-License-Identifier: NOASSERTION`
# on purpose: it is a placeholder the owner of a bootstrapped project replaces
# with their own license, and `NOASSERTION` has no text in LICENSES/, so
# `reuse lint` reports it as a missing license. This repo's own copy of the
# payload is MIT, exactly as the `templates/**` annotation near the top
# records, so override what REUSE sees here. The shipped files keep their
# placeholder, since this annotation never leaves the repository.
[[annotations]]
path = [
  "templates/packs/publishing/files/**",
  "templates/packs/licensing/files/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# Two files that arrive with an m3l-design release (bin/sync-design.sh) and
# carry no comment syntax: the release's own MIT license text and the checksum
# list for the vendored payload. They keep upstream's credit line, as
# m3l-design's REUSE.toml states it. Last in the file on purpose: when several
# tables match a path, the last one wins.
[[annotations]]
path = ["design/SHA256SUMS", "design/source/LICENSE"]
SPDX-FileCopyrightText = "2026 Enrico Lionello (enri3l), Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "MIT"

# The MONTE3L logo and the files made from it arrive with design/source/brand/.
# They are the organisation's identity, not MIT: all rights reserved apart from
# the permissions in design/source/brand/LICENSE.md. This table comes last and
# overrides the MIT table for design/source/** above. The folder's README.md and
# LICENSE.md are documentation and stay MIT.
[[annotations]]
path = [
  "design/source/brand/logo/**",
  "design/source/brand/favicon/**",
  "design/source/brand/github/**",
  "design/source/brand/social/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Enrico Lionello (enri3l), Giulia Montevecchi (giulmonte), monte3l"
SPDX-License-Identifier = "LicenseRef-MONTE3L-Brand"
