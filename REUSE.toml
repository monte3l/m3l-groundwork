# REUSE Software (https://reuse.software) annotations for files that cannot,
# or by this project's own convention should not, carry an inline SPDX
# header -- see CLAUDE.md's "Definition of Done" for the header this repo
# expects on every other tracked file, and `bin/check-license-headers.mjs`
# for the gate that gap-checks this file's globs against that expectation.
version = 1
SPDX-PackageName = "m3l-groundwork"
SPDX-PackageSupplier = "Enrico Lionello"
SPDX-PackageDownloadLocation = "https://github.com/monte3l/m3l-groundwork"

# templates/** is THE BASELINE this CLI emits into other people's projects
# (see CLAUDE.md's "Repository Layout"), not this repo's own source -- it
# deliberately carries no inline SPDX header, so a bootstrapped project never
# ships this repo's own copyright line as if it were the new project's own.
# This annotation records the license this repo's own copy of that payload
# is under; it says nothing about what a bootstrapped project's files are
# licensed as afterward -- that's the new project owner's own choice.
[[annotations]]
path = ["templates/**"]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

# design/**/*.json and design/**/*.md are already covered by the generic
# json/md annotation below with the same values, so only CSS -- this repo's
# first tracked CSS -- needs its own entry here. design/source/** is
# vendored, verbatim, from the m3l-design Claude Design artifact (see
# design/README.md for its provenance: artifact url, version, date copied);
# its content is the same person's own design system as this repo (see
# design/README.md), licensed the same way as the rest of this repo. The two
# vendored Google Fonts font files are a separate case, annotated below:
# they are not this repo's own copyright, and ship under their own upstream
# license.
[[annotations]]
path = ["design/**/*.css"]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["design/source/fonts/**"]
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The two OFL license texts as Google Fonts ships them alongside the font
# files (see design/source/fonts/** above) -- kept in their original,
# per-font location rather than moved into LICENSES/, since that is how a
# re-sync from Google Fonts (design/README.md) would overwrite them again.
[[annotations]]
path = ["design/source/licenses/**"]
SPDX-FileCopyrightText = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors, Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Everything else with no comment syntax of its own to carry a header in:
# data files, prose, and dotfiles.
[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "pnpm-lock.yaml",
  ".node-version",
  ".npmrc",
  ".gitignore",
  ".prettierignore",
  "LICENSE",
  "REUSE.toml",
  "LICENSES/**",
  ".gitleaks.toml",
]
SPDX-FileCopyrightText = "Copyright the m3l-groundwork contributors"
SPDX-License-Identifier = "MIT"
