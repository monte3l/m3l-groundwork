name: Claude PR Review

# What this does: automatically posts a Claude-written review comment on
# every pull request when it's opened or pushed to, checking the same
# things a human reviewer would (see the prompt below). It never approves,
# blocks, or pushes code -- it only comments -- and it skips bot-authored
# and fork pull requests.
#
# No `track_progress` and an explicit `--allowedTools` in `claude_args`
# below: this step runs in the action's automation mode (a `prompt` input is
# set), where a review's findings reach the PR only through a tool Claude is
# actually granted, per Anthropic's own
# docs/en/github-actions#interactive-and-automation-modes ("By default,
# results appear in the workflow run log rather than a comment. Claude can
# post ... when the prompt directs it to and it has a tool that can post").
# `track_progress: true` forces a different mode (tag mode, tracking-comment
# tool only) and has been observed elsewhere to complete a run successfully
# while leaving only the tracking comment's placeholder text -- the review
# itself never posted, and CI stayed green throughout. This workflow follows
# claude-code-action's own documented recipe instead (docs/solutions.md,
# "Automatic PR Code Review"): grant the posting tools via `claude_args`,
# and tell the prompt explicitly to use them.
#
# Read-only on repo contents (contents: read) -- Claude posts a review
# comment, it never pushes code, and it cannot submit a formal GitHub review
# or approve a PR (Anthropic's own docs/capabilities-and-limitations.md), so
# it cannot satisfy or bypass any branch-protection required check or
# approval count either way. Excludes bot-authored and fork PRs explicitly
# below, rather than relying on anthropics/claude-code-action's own internal
# bot/permission checks (docs/security.md) -- that way a Dependabot or fork
# PR never starts a run that would just fail on missing secrets. Runs but
# fails cleanly on an auth error until the one-time setup described in
# claude.yml's comments is done by hand.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel a stale run when the PR gets a new push, same as this project's own
# CI -- a `synchronize` fires on every push, and a paid review run per push
# queues up otherwise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reset, then grant per job.
permissions: {}

jobs:
  review:
    if: |
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # see claude.yml for why this is needed regardless of auth method
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: anthropics/claude-code-action@9171db3e57d6a3140a37ddc2ba92788584e0ead6 # v1.0.234
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Swap in CLAUDE_CODE_OAUTH_TOKEN or the Workload Identity
          # Federation inputs instead -- see claude.yml's comments for all
          # three auth options; this workflow needs the same one configured.

          # Pinned rather than left on the action's default: there is no
          # `model:` input (anthropics/claude-code-action's action.yml has
          # none), the action's own docs defer the default's definition to
          # a separate page rather than naming it, and no official source
          # states whether that default can change between action releases
          # -- an automated, unattended job like this one is exactly where a
          # silent shift would go unnoticed.
          #
          # `--fallback-model` (both `model:` and `fallback_model:` are
          # deprecated action inputs -- claude-code-action's docs/usage.md
          # says to configure both through `claude_args` now) tries the
          # listed model only when the primary is overloaded, unavailable,
          # or returns another non-retryable server error -- never for an
          # auth, billing, rate-limit, request-size, transport, or
          # org-policy failure, a real, currently-unfixed gap
          # (anthropics/claude-code-action#594, redirected to and
          # auto-closed `not_planned` as anthropics/claude-code#8413) -- but
          # worth having for the failure mode it does cover.
          claude_args: |
            --model claude-opus-5-5
            --fallback-model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. You already have this repository's CLAUDE.md
            loaded -- use it, don't restate it. Specifically check:

            1. If this project's CLAUDE.md documents a hub-and-spoke
               workflow for src/tests changes (test-author before
               code-implementer, review spokes run over the diff), confirm
               it was actually followed -- not just that the diff looks
               correct.
            2. Anything the project's own code-review checklist would catch
               (`.claude/agents/code-reviewer.md`, if present): correctness,
               security, SOLID/simplification, test coverage.
            3. If this project uses changesets or another release-versioning
               convention CLAUDE.md documents, whether this PR's public-
               surface change carries the entry that convention requires.

            Note: the PR branch is already checked out in the current
            working directory.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific code issues inline.
            Post one top-level summary covering every check above (say so
            explicitly for a check that passes, or that doesn't apply to
            this project) with:
              gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file -
            Only post GitHub comments -- don't submit review text as a plain
            chat response, since only a comment is visible on the PR.
