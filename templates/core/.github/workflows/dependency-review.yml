name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # BlueOak-1.0.0, Python-2.0 and BSD-2-Clause-Views are permissive and
          # cover the scaffold's own toolchain: minimatch and lru-cache from
          # ESLint's tree, argparse (through commitlint's js-yaml) and uri-js
          # (through ESLint's ajv 6). A new project's first lockfile adds them
          # all at once.
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, Unlicense, CC-BY-4.0, BlueOak-1.0.0, Python-2.0, BSD-2-Clause-Views
          # Packages exempted from the license check by package URL live in the
          # file below, never in this one, so an exemption never makes this
          # workflow differ from the org template. The file must exist and hold
          # at least one key: the action fails on a missing or an empty one.
          config-file: ./.github/dependency-review-config.yml
