name: Question
description: Ask how the CLI, the /customize plugin, or an emitted baseline works
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome. Say what you are trying to do and what you have tried, and the answer will come sooner.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you already tried?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The CLI or plugin version, if it matters
