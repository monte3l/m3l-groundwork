name: Bug report
description: Something in the CLI, the /customize plugin, or an emitted baseline is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability instead? Use [private vulnerability reporting](https://github.com/monte3l/m3l-groundwork/security/advisories/new), not this form.
  - type: dropdown
    id: component
    attributes:
      label: Where's the bug?
      options:
        - CLI (packages/cli) -- fresh mode
        - CLI (packages/cli) -- adopt mode
        - /customize plugin (packages/plugin)
        - Emitted baseline (templates/core)
        - A pack (templates/packs)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`npx @monte3l/groundwork@rc --version` (the `@rc` tag matters -- without it, `npx` resolves the bare `latest` tag, which is still the 0.0.0 placeholder), or the plugin's version from `/plugin`"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran, and against what kind of target directory
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: OS, Node version, relevant output from .groundwork/adoption-report.md, etc.
