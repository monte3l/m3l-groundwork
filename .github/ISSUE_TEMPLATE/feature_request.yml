name: Feature request
description: Suggest a change to the CLI, the /customize plugin, or the emitted baseline
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >-
        Describe the gap, not just the feature. Note that the emitted baseline
        has "caps" -- hard limits on how many agents, skills, hooks, CI
        workflows, and scripts it can carry (see
        https://github.com/monte3l/m3l-groundwork/blob/main/docs/glossary.md)
        -- so proposing a new one usually means an existing one has to be
        removed or merged first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
