name: Claude Code

# What this does: lets an owner, member or collaborator mention "@claude" in
# an issue, a PR review, or a review comment to ask Claude Code to make a
# change or answer a question, interactively. It runs whenever one of those
# events contains "@claude" in its text, and does nothing otherwise.
#
# Interactive mode only (no `prompt` input) -- Claude commits to a branch and
# links back to a PR-creation page; it never opens a PR itself, so this
# never bypasses the "every change lands through a human-opened PR" rule in
# CLAUDE.md's "Git Workflow". Runs but fails cleanly on an auth error until
# the one-time setup CLAUDE.md describes (Claude GitHub App install + a
# CLAUDE_CODE_OAUTH_TOKEN secret) is done by hand.
#
# Unlike pull requests (collaborators-only, see "Git Workflow"), issues and
# comments stay open to anyone, so the `@claude` text match alone isn't
# enough to keep an outside commenter from triggering a job that holds
# `contents: write` and `CLAUDE_CODE_OAUTH_TOKEN` -- the job's `if:` below
# also requires the `author_association` of the comment's, review's or
# issue's author on this repository to be OWNER, MEMBER or COLLABORATOR.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Reset, then grant per job.
permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    # One run per issue/PR at a time. A later @claude mention queues behind
    # the run in flight without cancelling it; GitHub keeps only the latest
    # pending run per group, so a burst of mentions can drop the middle ones.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required even with claude_code_oauth_token auth: the default GitHub
      # App authentication path uses this to fetch a GitHub OIDC token (OIDC
      # -- OpenID Connect -- is a short-lived, cryptographically signed
      # identity token GitHub Actions can mint for the running job, used
      # here for its own token exchange) separate from how the action
      # authenticates to Anthropic (docs/setup.md, anthropics/claude-code-action).
      id-token: write
      actions: read # lets Claude read CI results on the PR it's tagged in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub API commit signing: satisfies the `main` ruleset's
          # required-signed-commits check on whichever commits from this
          # branch end up on `main`, regardless of merge method (see
          # CLAUDE.md's "Git Workflow").
          use_commit_signing: true
