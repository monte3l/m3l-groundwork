name: Docs

# What this does: builds this repo's own docs site (bin/build-docs.mjs) and
# deploys it to Cloudflare Workers Static Assets at
# https://groundwork.monte3l.com, on a Custom Domain
# (.github/deploy-tools/wrangler.jsonc). Runs on every push to `main` and on
# manual dispatch -- not on every PR, since a PR's docs changes are already
# checked by `pnpm verify`'s `docs` step (bin/build-docs.mjs --check, in the
# `build` group); this workflow is what actually ships the result.
#
# Cloudflare has no GitHub OIDC as of this writing, so the deploy job
# authenticates with a long-lived, narrowly-scoped API token (Workers
# Scripts: Edit + Workers Routes: Edit on the monte3l.com zone only), stored
# as a `docs-cloudflare` environment secret restricted to `main`. See
# docs/cloudflare-docs.md for the one-time setup and the token's scope
# rationale.
#
# Previously deployed to GitHub Pages (`pages.yml`); replaced because the
# maintainer owns monte3l.com on Cloudflare and wants every project's docs
# site hosted there, not on GitHub's own domain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  # A half-published site is worse than a queued one; let an in-flight
  # deploy finish rather than cancelling it out from under a viewer.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      # Belt and suspenders: `verify`'s `docs` step already gates every PR,
      # but `main` has no branch protection against a direct push bypassing
      # that (this repo's own ruleset forbids it, but a fork or a future
      # policy change shouldn't be the only thing standing between a broken
      # link and a live deploy) -- `--check` re-validates before `--out`
      # ever writes anything this job would publish.
      - run: node bin/build-docs.mjs --check

      - run: node bin/build-docs.mjs --out _site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-cloudflare
      url: https://groundwork.monte3l.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: _site

      # --ignore-scripts is safe here: an assets-only `wrangler deploy` (no
      # bundling, no `wrangler dev`) needs neither esbuild's nor workerd's
      # postinstall-fetched binaries -- verified locally before adding this
      # step. Same pattern as release.yml's `npm ci --ignore-scripts --prefix
      # .github/release-tools`.
      - run: npm ci --ignore-scripts --prefix .github/deploy-tools

      - name: Deploy to Cloudflare
        working-directory: .github/deploy-tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Opt out of Cloudflare's anonymous usage telemetry for this CI job.
          WRANGLER_SEND_METRICS: "false"
        run: node_modules/.bin/wrangler deploy --config wrangler.jsonc

      # Confirms the deploy actually took effect and the security headers in
      # bin/lib/site-headers.mjs's generated _headers file are being served
      # -- a successful `wrangler deploy` only proves the upload succeeded,
      # not that Cloudflare's edge is serving the new version yet.
      - name: Smoke test
        run: |
          set -euo pipefail
          # Cloudflare's edge can return a transient error for a short window
          # right after a fresh Custom Domain's first attachment (observed:
          # a 403 immediately after `wrangler deploy` reported success,
          # resolved to a normal 200 within minutes with no other change) --
          # retry that class of response rather than failing the whole
          # deploy on a timing artifact. A non-transient, wrong status (e.g.
          # 200 where a 404 was expected) still fails immediately, since
          # retrying it would never change the answer.
          is_transient() {
            case "$1" in
              000 | 403 | 429 | 500 | 502 | 503 | 504) return 0 ;;
              *) return 1 ;;
            esac
          }
          fetch_status() {
            curl -sS -D "$2" -o /dev/null -w '%{http_code}' "$1" || echo 000
          }
          check() {
            url="$1"
            want="$2"
            header_file="$3"
            for attempt in 1 2 3 4 5 6; do
              status=$(fetch_status "$url" "$header_file")
              if [ "$status" = "$want" ]; then
                return 0
              fi
              if is_transient "$status" && [ "$attempt" -lt 6 ]; then
                echo "  $url -> $status (transient, attempt $attempt/6, retrying in 5s)"
                sleep 5
                continue
              fi
              echo "  $url -> $status, expected $want"
              return 1
            done
          }
          echo "Checking https://groundwork.monte3l.com/ ..."
          check "https://groundwork.monte3l.com/" 200 /tmp/root-headers.txt
          grep -qi '^content-security-policy:' /tmp/root-headers.txt || { echo "missing CSP header"; exit 1; }
          echo "Checking https://groundwork.monte3l.com/does-not-exist ..."
          check "https://groundwork.monte3l.com/does-not-exist" 404 /tmp/404-headers.txt
          echo "ok  smoke test passed"
