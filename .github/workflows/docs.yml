name: Docs

# What this does: builds this repo's own docs site (bin/build-docs.mjs) and
# deploys it to Cloudflare Workers Static Assets at
# https://groundwork.monte3l.com, on a Custom Domain
# (.github/deploy-tools/wrangler.jsonc). Runs on every push to `main` and on
# manual dispatch -- not on every PR, since a PR's docs changes are already
# checked by `pnpm verify`'s `docs` step (bin/build-docs.mjs --check, in the
# `build` group); this workflow is what actually ships the result.
#
# Cloudflare has no GitHub OIDC as of this writing, so the deploy job
# authenticates with a long-lived, narrowly-scoped API token (Workers
# Scripts: Edit + Workers Routes: Edit on the monte3l.com zone only), stored
# as a `docs-cloudflare` environment secret restricted to `main`. See
# docs/cloudflare-docs.md for the one-time setup and the token's scope
# rationale.
#
# Previously deployed to GitHub Pages (`pages.yml`); replaced because the
# maintainer owns monte3l.com on Cloudflare and wants every project's docs
# site hosted there, not on GitHub's own domain.
#
# No post-deploy smoke test: an earlier version of this job curl'd the live
# site after every deploy, but every run from a GitHub Actions runner got a
# persistent 403 from Cloudflare's edge (the identical URL, checked by hand
# from a non-datacenter IP at the same moment, returned 200 with every
# expected header) -- Cloudflare's Bot Fight Mode, which the zone
# deliberately keeps on. Bot Fight Mode runs outside the Ruleset Engine, so
# it cannot be selectively bypassed by a WAF Custom Rule's `Skip` action
# (confirmed against Cloudflare's own docs: "You cannot bypass or skip Bot
# Fight Mode using the Skip action in WAF custom rules"), and GitHub
# Actions' runner IPs are a huge, rotating cloud range with no stable,
# narrow allowlist to carve out instead. `wrangler deploy`'s own exit code
# (checked above) already fails the job if the upload itself fails; a
# smoke test only added a check that a real bot-mitigation feature reliably
# blocks precisely the traffic doing the checking.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  # A half-published site is worse than a queued one; let an in-flight
  # deploy finish rather than cancelling it out from under a viewer.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      # Belt and suspenders: `verify`'s `docs` step already gates every PR,
      # but `main` has no branch protection against a direct push bypassing
      # that (this repo's own ruleset forbids it, but a fork or a future
      # policy change shouldn't be the only thing standing between a broken
      # link and a live deploy) -- `--check` re-validates before `--out`
      # ever writes anything this job would publish.
      - run: node bin/build-docs.mjs --check

      - run: node bin/build-docs.mjs --out _site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-cloudflare
      url: https://groundwork.monte3l.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: _site

      # --ignore-scripts is safe here: an assets-only `wrangler deploy` (no
      # bundling, no `wrangler dev`) needs neither esbuild's nor workerd's
      # postinstall-fetched binaries -- verified locally before adding this
      # step. Same pattern as release.yml's `npm ci --ignore-scripts --prefix
      # .github/release-tools`.
      - run: npm ci --ignore-scripts --prefix .github/deploy-tools

      - name: Deploy to Cloudflare
        working-directory: .github/deploy-tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Opt out of Cloudflare's anonymous usage telemetry for this CI job.
          WRANGLER_SEND_METRICS: "false"
        run: node_modules/.bin/wrangler deploy --config wrangler.jsonc
