name: Docs

# What this does: builds this repo's own docs site (bin/build-docs.mjs) and
# deploys it to Cloudflare Workers Static Assets at
# https://groundwork.monte3l.com, on a Custom Domain
# (tools/deploy/wrangler.jsonc). Runs on every push to `main` and on
# manual dispatch -- not on every PR, since a PR's docs changes are already
# checked by `pnpm verify`'s `docs` step (bin/build-docs.mjs --check, in the
# `build` group); this workflow is what actually ships the result.
#
# Cloudflare has no GitHub OIDC as of this writing, so the deploy job
# authenticates with a long-lived, narrowly-scoped API token (Workers
# Scripts: Edit + Workers Routes: Edit on the monte3l.com zone only), stored
# as a `docs-cloudflare` environment secret restricted to `main`. See
# docs/cloudflare-docs.md for the one-time setup and the token's scope
# rationale.
#
# Previously deployed to GitHub Pages (`pages.yml`); replaced because the
# maintainer owns monte3l.com on Cloudflare and wants every project's docs
# site hosted there, not on GitHub's own domain.
#
# After the deploy, the `smoke` job fetches every page, the 404 page and
# every asset from the live site and requires each to equal the file the
# `build` job produced, with every header the generated `_headers` file asks
# for (bin/check-live-site.mjs). That catches a deploy that never landed and a
# Cloudflare zone setting that rewrites the site behind the repo's back (zone
# HSTS replacing the per-response header, JavaScript detections injecting a
# script). An earlier smoke test got a persistent 403 from a GitHub Actions
# runner because Bot Fight Mode was on; the zone now has it off (see
# docs/cloudflare-docs.md), so this job needs no bypass rule. If it fails with
# a 403 again, a bot-protection setting was switched back on.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  # A half-published site is worse than a queued one; let an in-flight
  # deploy finish rather than cancelling it out from under a viewer.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      # Belt and suspenders: `verify`'s `docs` step already gates every PR,
      # against a `main` the ruleset requires the branch to be up to date
      # with. `--check` still re-validates the merged result before `--out`
      # ever writes anything this job would publish, so a path that skips
      # `verify` (a re-run, a manual dispatch) cannot ship a broken link.
      - run: node bin/build-docs.mjs --check

      - run: node bin/build-docs.mjs --out _site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: _site
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-cloudflare
      url: https://groundwork.monte3l.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: _site

      # --ignore-scripts is safe here: an assets-only `wrangler deploy` (no
      # bundling, no `wrangler dev`) needs neither esbuild's nor workerd's
      # postinstall-fetched binaries -- verified locally before adding this
      # step. Same pattern as release.yml's `npm ci --ignore-scripts --prefix
      # tools/release`.
      - run: npm ci --ignore-scripts --prefix tools/deploy

      - name: Deploy to Cloudflare
        working-directory: tools/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Opt out of Cloudflare's anonymous usage telemetry for this CI job.
          WRANGLER_SEND_METRICS: "false"
        run: node_modules/.bin/wrangler deploy --config wrangler.jsonc

  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: _site

      # Retries for about a minute by default: a fresh deploy can take a
      # moment to reach the edge that answers this runner.
      - run: node bin/check-live-site.mjs --site _site
