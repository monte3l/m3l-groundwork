name: Commit lint

# Fails a pull request whose title, or any non-merge commit, is not a
# Conventional Commit. The release workflow reads these messages to decide the
# version bump and write the changelog, so one that does not parse is a change
# the release silently ignores. With squash merging the title becomes the
# commit message, which is why it is checked first.
#
# This is a template, not a reusable workflow, on purpose: a required check
# from a reusable workflow is reported as `<caller job> / <called job>`, which
# would not match the plain `Commit lint` name the `main` ruleset will require. Keep
# the job name `Commit lint` and do not filter by path (a skipped required check
# never reports).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the title and the commit subjects
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/@-]+\))?!?: [^ ]'
          failed=0
          check() {
            # GitHub's own revert title is accepted: it is not worth fighting.
            if [[ ! "$2" =~ $pattern && ! "$2" =~ ^Revert\ \" ]]; then
              printf 'Not a Conventional Commit (%s): %s\n' "$1" "$2"
              failed=1
            fi
          }
          check "pull request title" "$TITLE"
          while IFS= read -r subject; do
            [[ -n "$subject" ]] || continue
            check "commit" "$subject"
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit "$failed"
