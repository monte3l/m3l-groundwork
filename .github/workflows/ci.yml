name: CI

# What this does: runs the project's checks (formatting, linting, type
# checking, build, unit tests, and end-to-end tests) on every push and pull
# request to `main`, then reports one aggregated `verify` status for the
# branch ruleset to gate on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. No job here writes to the repository; a job
# that ever needs more escalates in its own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each lane below invokes `node bin/verify.mjs --group <name>`, naming one
  # of the five fixed groups in bin/lib/verify-steps.mjs. That is the whole
  # parity guarantee: lefthook's pre-push lanes and these jobs read the same
  # step list by group, so a step can never run in one place and not the
  # other.
  #
  # Two rules this file must keep, both enforced by the toolchain grader's
  # `gate-lane-parity` rule, which scrapes workflow YAML as text:
  #   - never name a step id here; name a group, so a new step joins its
  #     lane without this file changing.
  #   - never invoke verify.mjs without a statically written group. A matrix
  #     over the group name reads as "dynamic" and switches the rule off for
  #     every workflow file at once, because the grader concatenates them.
  #     The repetition below is the price of keeping that check live.
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # pnpm must be on PATH before setup-node, or `cache: pnpm` cannot
      # locate the store. Its version comes from package.json's
      # `packageManager` field, never from an input here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # `.node-version` is the single authoritative Node pin -- a literal
      # `node-version:` value here would fail `pnpm check:node-version`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group build

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group test

  # Not a verify group: the e2e suites bootstrap throwaway projects into temp
  # directories with the built CLI, then run each one's own `pnpm install`
  # and `pnpm verify`. Real child processes, real registry traffic. They are
  # excluded from `pnpm test` by vitest.config.ts and are the only proof the
  # emitted baseline works standalone, so they run on every push rather than
  # behind a `paths:` filter -- a path-filtered required check never reports
  # on a PR that misses the filter, and the repo is public, so minutes are
  # free.
  #
  # The one exception is a pull request that changes only documentation
  # (`docs/**` and root-level markdown): `e2e`, `e2e-macos` and `node-current`
  # then skip their pnpm and Node setup, install, build and test steps. The
  # skip lives inside each job, never in a job-level `if:` or a `paths:`
  # filter, so the job still ends in `success` and `verify` keeps getting the
  # explicit success it demands from every lane. The setup is skipped too,
  # not just the work: `actions/setup-node`'s post step would otherwise try
  # to save a pnpm cache for a store nothing installed, and fail the job on
  # a cache miss. `bin/ci-docs-only.mjs` decides, on the runner's own Node,
  # and any doubt (not a pull request, no base commit, a git error, an empty
  # diff, the step itself failing) means "run everything". A push to `main`
  # is never a pull request, so it always runs in full.
  #
  # `pnpm eval` is deliberately absent: it makes paid model calls and must
  # never run unattended.
  e2e:
    name: End-to-end (bootstrap, adopt, packs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Before pnpm and Node are set up, on the runner's own Node: see the
      # comment above `e2e`. If it cannot decide, its output stays empty and
      # every step below runs.
      - id: scope
        continue-on-error: true
        run: node bin/ci-docs-only.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # templates/core names exactly this repo's devDependency set, so this
      # install warms the pnpm store for the emitted projects' own installs.
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      # The suites spawn packages/cli/bin/m3l-groundwork.mjs, which imports
      # ../dist/main.js -- `pnpm test:e2e` does not build it.
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:e2e
      - if: steps.scope.outputs.docs_only == 'true'
        run: echo "documentation-only change, end-to-end skipped"

  # The same e2e suites on macOS: the CLI, the emitted projects and the
  # packed tarball are all path- and shell-sensitive (dotfile restoration,
  # symlinked temp dirs under /var -> /private/var, BSD userland), and this
  # project's maintainer works on macOS, so a regression that only bites
  # there should fail a required check rather than a developer's laptop.
  # A separate job, never a matrix over `os`, for the same reason the lanes
  # above are not matrixed. Same invocation as `e2e`, same
  # `.node-version` pin.
  e2e-macos:
    name: End-to-end (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Before pnpm and Node are set up, on the runner's own Node: see the
      # comment above `e2e`. If it cannot decide, its output stays empty and
      # every step below runs.
      - id: scope
        continue-on-error: true
        run: node bin/ci-docs-only.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:e2e
      - if: steps.scope.outputs.docs_only == 'true'
        run: echo "documentation-only change, end-to-end skipped"

  # Proves the toolchain also works on the newest Node release line, not
  # just the pinned one -- a separate job, never a matrix: matrixing the
  # node version is exactly the kind of dynamic invocation that would read
  # as a matrix to gate-lane-parity's own scraper (see the comment at the
  # top of this file) if it ever touched `--group`, and keeping this job
  # static keeps the same guarantee for the Node version itself. This job
  # intentionally does NOT read `.node-version`: `current` tracks whatever
  # Node.js currently calls its Current release line, which is exactly what
  # this job exists to catch drift against.
  node-current:
    name: Verify (Node current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Before pnpm and Node are set up, on the runner's own Node: see the
      # comment above `e2e`. If it cannot decide, its output stays empty and
      # every step below runs.
      - id: scope
        continue-on-error: true
        run: node bin/ci-docs-only.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: current
          cache: pnpm
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm verify
      - if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:e2e
      - if: steps.scope.outputs.docs_only == 'true'
        run: echo "documentation-only change, Node current verify skipped"

  # The DCO, enforced by the server and not only by the local commit-msg
  # hook (OSPS Baseline OSPS-LE-01.01 asks for a status check). Every commit
  # a pull request adds must carry a `Signed-off-by: Name <email>` trailer
  # whose email is the commit's author or committer email, so it is the
  # contributor's own assertion. It runs for every PR, a documentation-only
  # one included, and on a push to `main` it passes without checking: there
  # is no PR range there, and `verify` needs an explicit `success` from every
  # lane. Merge commits are skipped (this repository merges with merge
  # commits, and GitHub writes those). Two first-party automation identities
  # are exempt, but only when BOTH the pull request was opened by that bot
  # (`pull_request.user.login`, which GitHub sets and a commit author field
  # cannot forge) AND the commit's author name is the same bot, so naming a
  # commit author `dependabot[bot]` inside a human's PR skips nothing.
  # `m3l-groundwork-release[bot]` never signs off, and Dependabot signs off
  # as support@github.com, which is not its author email. The range and
  # author arrive through env, never inline in the script. `--no-divider` matters: a Dependabot body holds a `---`
  # line, which `git interpret-trailers` otherwise reads as the end of the
  # message and so finds no trailers at all.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit in the pull request is signed off
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "not a pull request (event: $EVENT_NAME) -- nothing to check"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "pull request event without a base or head commit -- failing closed" >&2
            exit 1
          fi
          checked=0
          bad=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author="$(git log -1 --format=%an "$sha")"
            short="$(git log -1 --format='%h %s' "$sha")"
            case "${PR_AUTHOR}|${author}" in
              "m3l-groundwork-release[bot]|m3l-groundwork-release[bot]" | "dependabot[bot]|dependabot[bot]")
                echo "skip   $short (first-party automation: $author)"
                continue
                ;;
            esac
            checked=$((checked + 1))
            author_email="$(git log -1 --format=%ae "$sha" | tr '[:upper:]' '[:lower:]')"
            committer_email="$(git log -1 --format=%ce "$sha" | tr '[:upper:]' '[:lower:]')"
            ok=0
            while IFS= read -r line; do
              # `Signed-off-by: Name <email>`, exactly one angle-bracketed address.
              email="$(printf '%s\n' "$line" | sed -nE 's/^Signed-off-by: .+ <([^<>[:space:]]+@[^<>[:space:]]+)>$/\1/p' | tr '[:upper:]' '[:lower:]')"
              if [ -n "$email" ] && { [ "$email" = "$author_email" ] || [ "$email" = "$committer_email" ]; }; then
                ok=1
              fi
            done < <(git log -1 --format=%B "$sha" | git interpret-trailers --parse --no-divider)
            if [ "$ok" -eq 1 ]; then
              echo "ok     $short"
            else
              echo "::error title=Missing DCO sign-off::$short has no Signed-off-by trailer matching its author or committer email (git commit -s, or git commit --amend -s --no-edit)"
              bad=$((bad + 1))
            fi
          done
          echo "checked $checked commit(s), $bad without a valid sign-off"
          [ "$bad" -eq 0 ]

  # The single required check: one status to protect the branch with, whose
  # `needs` list is the only place lanes are enumerated.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs:
      [format, lint, typecheck, build, test, e2e, e2e-macos, node-current, dco]
    if: always()
    timeout-minutes: 5
    steps:
      # Testing only for 'failure' is a hole: a lane that was cancelled or
      # skipped is not a failure, so it would pass and this job would report
      # green over a run that never finished. Require an explicit success
      # from every lane instead, so anything else fails closed.
      - name: Check lane results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required lane did not succeed: $RESULTS" >&2
              exit 1
            fi
          done
