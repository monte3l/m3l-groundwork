name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. No job here writes to the repository; a job
# that ever needs more escalates in its own `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each lane below invokes `node bin/verify.mjs --group <name>`, naming one
  # of the five fixed groups in bin/lib/verify-steps.mjs. That is the whole
  # parity guarantee: lefthook's pre-push lanes and these jobs read the same
  # step list by group, so a step can never run in one place and not the
  # other.
  #
  # Two rules this file must keep, both enforced by the toolchain grader's
  # `gate-lane-parity` rule, which scrapes workflow YAML as text:
  #   - never name a step id here; name a group, so a new step joins its
  #     lane without this file changing.
  #   - never invoke verify.mjs without a statically written group. A matrix
  #     over the group name reads as "dynamic" and switches the rule off for
  #     every workflow file at once, because the grader concatenates them.
  #     The repetition below is the price of keeping that check live.
  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # pnpm must be on PATH before setup-node, or `cache: pnpm` cannot
      # locate the store. Its version comes from package.json's
      # `packageManager` field, never from an input here.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # `.node-version` is the single authoritative Node pin -- a literal
      # `node-version:` value here would fail `pnpm check:node-version`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group build

  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node bin/verify.mjs --group test

  # Not a verify group: the e2e suites bootstrap throwaway projects into temp
  # directories with the built CLI, then run each one's own `pnpm install`
  # and `pnpm verify`. Real child processes, real registry traffic. They are
  # excluded from `pnpm test` by vitest.config.ts and are the only proof the
  # emitted baseline works standalone, so they run on every push rather than
  # behind a `paths:` filter -- a path-filtered required check never reports
  # on a PR that misses the filter, and the repo is public, so minutes are
  # free.
  #
  # `pnpm eval` is deliberately absent: it makes paid model calls and must
  # never run unattended.
  e2e:
    name: End-to-end (bootstrap, adopt, packs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # templates/core names exactly this repo's devDependency set, so this
      # install warms the pnpm store for the emitted projects' own installs.
      - run: pnpm install --frozen-lockfile
      # The suites spawn packages/cli/bin/m3l-groundwork.mjs, which imports
      # ../dist/main.js -- `pnpm test:e2e` does not build it.
      - run: pnpm build
      - run: pnpm test:e2e

  # Proves the toolchain also works on the newest Node release line, not
  # just the pinned one -- a separate job, never a matrix: matrixing the
  # node version is exactly the kind of dynamic invocation that would read
  # as a matrix to gate-lane-parity's own scraper (see the comment at the
  # top of this file) if it ever touched `--group`, and keeping this job
  # static keeps the same guarantee for the Node version itself. This job
  # intentionally does NOT read `.node-version`: `current` tracks whatever
  # Node.js currently calls its Current release line, which is exactly what
  # this job exists to catch drift against.
  node-current:
    name: Verify (Node current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: current
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:e2e

  # The single required check: one status to protect the branch with, whose
  # `needs` list is the only place lanes are enumerated.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, build, test, e2e, node-current]
    if: always()
    timeout-minutes: 5
    steps:
      # Testing only for 'failure' is a hole: a lane that was cancelled or
      # skipped is not a failure, so it would pass and this job would report
      # green over a run that never finished. Require an explicit success
      # from every lane instead, so anything else fails closed.
      - name: Check lane results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lane results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required lane did not succeed: $RESULTS" >&2
              exit 1
            fi
          done
