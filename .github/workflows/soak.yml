name: Soak (published package)

# What this does: installs the PUBLISHED `@monte3l/groundwork` from the npm
# registry, never the checkout, and runs `bin/soak.sh` against it on Linux x64,
# Linux arm64 and macOS: the negative-path checks, a fresh bootstrap of every
# pack combination (each one's own install and gate run), and adopt mode on
# three public repositories. `ci.yml`'s e2e lanes run the built checkout, on
# Linux x64 and macOS, so this is the one place the registry artifact, and
# Linux arm64, get exercised before a promotion or after a release.
#
# Manual only, and not a required check. Run it with
# `gh workflow run soak.yml -f version=<dist-tag or exact version>`. It reads
# nothing secret and holds a read-only token.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm dist-tag or exact version to soak"
        required: false
        default: rc
        type: string

permissions: {}

concurrency:
  group: soak-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  soak:
    name: Soak (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      # Checked out only for `.node-version` and `bin/soak.sh`; the script
      # runs from the runner's temp directory and never touches the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Soak the published package
        # The input goes in through the environment, never interpolated into
        # the script text, and `bin/soak.sh` rejects anything but a version
        # or dist-tag.
        env:
          SOAK_VERSION: ${{ inputs.version }}
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/bin/soak.sh" -v "$SOAK_VERSION" -w "$RUNNER_TEMP/soak"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/soak/results.tsv
            ${{ runner.temp }}/soak/logs
          if-no-files-found: warn
          retention-days: 14
