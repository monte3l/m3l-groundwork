name: Claude PR Review

# What this does: reviews each pull request once, when it's opened or marked
# ready, with Anthropic's official `code-review` plugin run through
# `anthropics/claude-code-action`, and posts the result as the Claude GitHub
# App (`claude[bot]`): an inline comment per validated finding, or one
# "No issues found" summary. It never approves, blocks, or pushes code, and it
# skips bot-authored, fork and draft pull requests.
#
# This is Anthropic's documented workflow, unchanged in shape:
# https://code.claude.com/docs/en/github-actions#run-a-skill (the one
# `/install-github-app` generates), authenticated with a subscription OAuth
# token as that page describes. The plugin stops if Claude has already
# commented on the PR, so later pushes cost one cheap gate check and post
# nothing; a fresh review needs Claude's comment deleted. It reports only
# validated, high-signal findings (bugs and quoted CLAUDE.md violations), not
# severity tiers. A review is never a formal GitHub review, so it cannot
# satisfy or bypass the `main` ruleset's required checks or its 0-approval rule.
#
# Three things go beyond the docs example, all for one upstream bug class: the
# run goes green and posts nothing (anthropics/claude-code-action#1646, #1499,
# #1852, #1523, #1679, #1823 -- open, no Anthropic reply or official workaround).
# The plugin backgrounds its sub-reviewers and the action ends the session at
# the first result, so their findings never post.
#   - CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1, a documented Claude Code variable
#     (code.claude.com/docs/en/env-vars), runs them in the foreground, the
#     control flow the plugin assumes. Evidence it fixes this is community-
#     measured (#1646: 4 of 4 runs posted, against 2 of 7 before), not Anthropic's.
#   - `Bash(gh pr comment:*)` is added to --allowedTools because the plugin's
#     "No issues found" summary posts with it and #1646 reports the plugin's own
#     `allowed-tools` doesn't carry it under the action.
#   - `verify-posted` fails the job when no comment from Claude exists
#     afterwards, so a silent green becomes a red a re-run can fix.
#
# One run is deliberately not a failure: the action refuses to run on a PR that
# edits this very file (its copy must match the default branch's, a guard
# against a PR rewriting its own reviewer), logs a warning and exits green with
# no outputs. `verify-posted` recognizes that case and passes with a notice.
# A PR touching this file therefore gets no review until it merges.
#
# Excludes bot-authored, fork and draft PRs explicitly below, rather than relying
# on the action's own checks (docs/security.md), so a Dependabot or fork run
# that would only fail on a missing secret or the bot-actor check never starts.
# Runs but fails cleanly on an auth error until the one-time setup CLAUDE.md
# describes is done by hand.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review run per PR at a time. A push queues behind the run in flight
# rather than cancelling it mid-post (the docs' cost advice is a concurrency
# control, and a cancelled run would leave a half-posted review).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Reset, then grant per job.
permissions: {}

jobs:
  review:
    if: |
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # see claude.yml for why this is needed regardless of auth method
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - id: claude
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The action starts the MCP server that posts inline comments only
          # when --allowedTools names it, even though the skill's own
          # `allowed-tools` frontmatter does too.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'

      # always(): the point is to catch a green action step that posted nothing.
      # Everything attacker-influenced reaches the script through `env:` only.
      - name: Verify Claude posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          set -euo pipefail
          # A comment, a review or an inline comment by the Claude App counts.
          posted=0
          for endpoint in issues/$PR/comments pulls/$PR/reviews pulls/$PR/comments; do
            n=$(gh api --paginate "repos/$GH_REPO/$endpoint" \
              --jq '[.[] | select(.user.login == "claude[bot]")] | length' \
              | awk '{ s += $1 } END { print s + 0 }')
            posted=$((posted + n))
          done
          if [ "$posted" -gt 0 ]; then
            echo "Claude has $posted comment(s) or review(s) on PR #$PR."
            exit 0
          fi
          # The action's documented self-edit skip: no conclusion AND this PR
          # really changes this file. Any other silence is a failure.
          if [ -z "$CONCLUSION" ] \
            && gh pr diff "$PR" --name-only | grep -Fxq '.github/workflows/claude-pr-review.yml'; then
            echo "::notice::Claude was skipped: this PR edits claude-pr-review.yml, so claude-code-action will not run it until it merges. No review is posted."
            exit 0
          fi
          echo "::error title=No review posted::The Claude step finished (conclusion: '${CONCLUSION:-none}') but PR #$PR has no comment from claude[bot]. Re-run this job."
          exit 1
