name: Pages

# What this does: builds this repo's own docs site (bin/build-docs.mjs) and
# publishes it to GitHub Pages. Runs on every push to `main` and on manual
# dispatch -- not on every PR, since a PR's docs changes are already checked
# by `pnpm verify`'s `docs` step (bin/build-docs.mjs --check, in the `build`
# group); this workflow is what actually ships the result. The builder is
# zero-dependency (only Node builtins plus this repo's own bin/lib/*.mjs), so
# the build job needs no `pnpm install` -- just checkout, setup-node, and the
# build command itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  # A half-published site is worse than a queued one; let an in-flight
  # deploy finish rather than cancelling it out from under a viewer.
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      # Belt and suspenders: `verify`'s `docs` step already gates every PR,
      # but `main` has no branch protection against a direct push bypassing
      # that (this repo's own ruleset forbids it, but a fork or a future
      # policy change shouldn't be the only thing standing between a broken
      # link and a live deploy) -- `--check` re-validates before `--out`
      # ever writes anything this job would publish.
      - run: node bin/build-docs.mjs --check

      - run: node bin/build-docs.mjs --out _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
