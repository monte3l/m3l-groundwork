name: Release

# What this does: on every push to `main`, this workflow either opens a PR
# that bumps package versions and changelogs, or -- once that PR has merged
# -- packs and publishes the CLI to npm. It runs
# [Changesets](https://github.com/changesets/changesets), the tool this repo
# uses to track pending releases (each PR that changes the CLI's user-facing
# behavior adds a small Markdown file under `.changeset/` describing the
# change and its version bump; this workflow reads those files to decide
# what to do next).
#
# The flow, one job each:
#   1. select-mode  reads the repo and decides: "version", "publish", or "none"
#   2. version      opens or updates the "Version Packages" PR
#   3. pack         builds, runs every gate, and packs the tarballs
#   4. publish      uploads those tarballs to npm via trusted publishing
#
# "Trusted publishing" is npm's passwordless publish mechanism: instead of a
# long-lived npm token stored as a secret, this workflow proves its identity
# to npm via OIDC (OpenID Connect -- a short-lived, cryptographically signed
# token GitHub Actions mints for the running job, which npm verifies against
# the trusted-publisher config for this exact repo and workflow file). This
# is the shape the changesets docs recommend for trusted publishing: the one
# job that holds the OIDC token (`publish`, via `id-token: write`) never runs
# build, test, or repo-script code -- it only runs the changesets CLI and the
# pnpm shim below, with `--ignore-scripts`. `pack` holds nothing beyond
# `contents: read`.
#
# "Staged" publish (vs. a "direct" one) means `npm stage publish` uploads the
# tarball and creates the version, but it isn't installable yet until a
# maintainer separately approves it with 2FA (`npm stage approve`) -- npm's
# own stronger default over a direct `npm publish`, which would make the
# version live immediately. "Provenance" is the signed, publicly verifiable
# record npm attaches to a trusted-published package, linking it back to the
# exact commit and workflow run that built it.
#
# npm trusted publishers are configured per package, against this exact file
# name (`release.yml`, not a path). See CLAUDE.md, "Releases", for the full
# design rationale.
on:
  push:
    branches: [main]

# Reset, then grant per job.
permissions: {}

# Releases must not be cancelled midway, so no cancel-in-progress here (unlike
# ci.yml): a half-published release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same setup as ci.yml. `.node-version` is the single Node pin, so this
      # file must never carry a literal version (`pnpm check:node-version`).
      # No package-manager cache anywhere in this file: a restored cache is an
      # input an attacker can poison, and these jobs are the ones that publish.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2

  version:
    name: Open version PR
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # actions/checkout; the app token below does the actual writing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # `main`'s branch ruleset requires `verify`, `Dependency Review` and
      # `CodeQL` on every PR with no bypass actor (see CLAUDE.md, "Git
      # Workflow") -- including this one. A PR opened with the default
      # GITHUB_TOKEN would never trigger those `pull_request`-event workflows
      # (GitHub's own anti-recursion rule) and could therefore never merge, so
      # this mints a short-lived token from a GitHub App installed on this repo
      # instead. The app-token approach, not a PAT or a ruleset bypass, is what
      # both GitHub's own docs and changesets' own automating guide recommend
      # for exactly this case -- see CLAUDE.md, "Releases". The App needs only
      # `contents: write` and `pull-requests: write`; its token auto-expires in
      # an hour and this action revokes it when the job ends.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          # Both created as repo secrets (`gh secret set`), not vars: the
          # client ID isn't sensitive on its own, but keeping both next to
          # each other avoids a second place to remember to update.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # `version:packages` syncs plugin.json to the new version (never
      # marketplace.json -- it deliberately carries no version pin, see
      # CLAUDE.md) and refreshes the lockfile (see package.json).
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: pnpm version:packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack:
    name: Verify and pack
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The whole gate, then the end-to-end suite, before a tarball exists.
      # `pnpm verify` is one full run of every group, the same steps ci.yml
      # spreads across its lanes -- this is a single full run rather than a
      # per-lane invocation, so it deliberately does not name a group.
      # test:e2e includes the packed-tarball test: it packs the CLI, unpacks
      # it outside the repo and runs it, which is the only check that the
      # published artifact works.
      - run: pnpm verify
      - run: pnpm test:e2e
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gates the git tag, the GitHub Release, and `npm stage publish` behind a
    # required reviewer (see CLAUDE.md, "Releases" -- "Not done, worth
    # knowing"): without this, all three already exist by the time a
    # maintainer even sees there's a staged version to approve with
    # `npm stage approve`. The environment (created once, by hand, via
    # `gh api`) has no branch restriction beyond `main` and no wait timer --
    # it exists to require a person, not to add a delay.
    environment: npm-publish
    permissions:
      contents: write # changesets/action/publish pushes tags and creates GitHub Releases
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Only the changesets CLI is needed here, not any package's lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `npm stage publish` needs npm >= 11.15.0 (Node >= 22.14.0, already
      # covered by .node-version's 24). Pinned to an exact version -- this
      # job holds the OIDC token, and OpenSSF Scorecard's
      # Pinned-Dependencies check (scorecard.yml) flags any unpinned
      # package-manager install the same way it flags an unpinned Action.
      # A bare `npm install --global npm@X.Y.Z` here would only pin the
      # VERSION string, not verify it against anything -- .github/release-
      # tools/package-lock.json pins the exact tarball via its sha512
      # integrity hash instead, and `npm ci` verifies the install against
      # it. Dependabot's npm ecosystem is scoped to this one directory (see
      # dependabot.yml), so bumping the pin is the same reviewed-PR flow as
      # any other pin here, just via a lockfile diff instead of a bare
      # version string.
      - run: npm ci --ignore-scripts --prefix .github/release-tools
      - run: echo "$GITHUB_WORKSPACE/.github/release-tools/node_modules/.bin" >> "$GITHUB_PATH"
      # changesets publishes through `pnpm publish` in a pnpm workspace, and
      # pnpm 12's native publish is rejected by npmjs.com's OIDC exchange
      # (403 "OIDC permission denied"). This puts a `pnpm` ahead of the real
      # one that forwards everything except `publish`, which goes to
      # `npm stage publish` (see bin/pnpm-publish-shim.mjs -- the trusted
      # publisher only allows staged publishing, npm's own default since
      # 2026-09-03; a direct `npm publish` gets the same 403 for a different
      # reason). Remove both once pnpm's own publish authenticates.
      - name: Route publish through the npm CLI
        run: |
          shim_dir="$RUNNER_TEMP/pnpm-shim"
          mkdir -p "$shim_dir"
          printf '#!/bin/sh\nexport PNPM_SHIM_DIR=%s\nexec node "%s/bin/pnpm-publish-shim.mjs" "$@"\n' \
            "$shim_dir" "$GITHUB_WORKSPACE" > "$shim_dir/pnpm"
          chmod +x "$shim_dir/pnpm"
          echo "$shim_dir" >> "$GITHUB_PATH"
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      # Staging succeeds unattended; going live needs a maintainer's 2FA
      # (`npm stage approve <id>`, on the CLI or npmjs.com -- never
      # automatable, by design). Best-effort convenience only: this job never
      # logs in with a token (it publishes purely via the OIDC exchange
      # scoped to the publish call itself), so `npm stage list` may have
      # nothing to authenticate as and print nothing useful -- `|| true`
      # means that possibility never fails the job. `npm stage list
      # --package @monte3l/groundwork` from a logged-in machine is the
      # reliable way to find what's waiting.
      - name: List pending stages (best effort)
        if: always()
        run: npm stage list --package @monte3l/groundwork || true
