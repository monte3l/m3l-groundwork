name: Release

# What this does: on every push to `main`, this workflow either opens or
# updates the release pull request, or -- once that pull request has merged --
# packs the CLI, attests it, stages it on npm and publishes the GitHub
# Release. The versioning is the organisation's shared release baseline
# (monte3l/.github, blueprint/README.md, "Releases"): release-please reads the
# Conventional Commits since the last tag, so there is no changeset to write.
#
# The flow, one job each:
#   1. prepare   shared: opens or updates the release PR, or on merge tags the
#                commit and creates a DRAFT GitHub Release
#   2. pack      builds, runs every gate and packs the tarball, with no secrets
#   3. publish   attests the tarball and its SBOM, attaches them to the draft,
#                and stages the package on npm through trusted publishing
#   4. finalize  shared: publishes the draft last, then tells m3l-plugins
#
# "Trusted publishing" is npm's passwordless publish mechanism: instead of a
# long-lived npm token stored as a secret, `publish` proves its identity to npm
# via OIDC (OpenID Connect -- a short-lived, cryptographically signed token
# GitHub Actions mints for the running job, which npm verifies against the
# trusted-publisher config for this exact repository and workflow file). The
# job that holds the OIDC token (`publish`, via `id-token: write`) never runs
# build, test, or repo-script code beyond the pinned publisher below; `pack`
# holds nothing beyond `contents: read`.
#
# "Staged" publish (vs. a "direct" one) means a staged publish uploads the
# tarball and creates the version, but it isn't installable yet until a
# maintainer separately approves it with 2FA (`npm stage approve`) -- npm's
# own stronger default over a direct `npm publish`, which would make the
# version live immediately. "Provenance" is the signed, publicly verifiable
# record npm attaches to a trusted-published package, linking it back to the
# exact commit and workflow run that built it.
#
# npm trusted publishers are configured per package, against this exact file
# name (`release.yml`, not a path), and npm checks the CALLING workflow, so the
# shared workflows below may live elsewhere. Never rename this file. See
# CLAUDE.md, "Releases", for the full design rationale.
on:
  push:
    branches: [main]
  # A run that fails at startup (an Actions policy blocking an action, for
  # example) cannot be re-run, and nothing else would start a new one before
  # the next push. `prepare` below refuses any ref but the default branch.
  workflow_dispatch:

# Reset, then grant per job.
permissions: {}

# Releases must not be cancelled midway, so no cancel-in-progress here (unlike
# ci.yml): a half-published release is worse than a queued one. One group for
# the repository also stops two pushes racing over one release pull request.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: monte3l/.github/.github/workflows/release-prepare.yml@4e2797a213e85b6dd24c3e729fe15385924fc091 # release-baseline
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  pack:
    name: Verify and pack
    needs: [prepare]
    if: needs.prepare.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read # actions/checkout
    steps:
      # The commit the release PR merged as, which is also the one the draft's
      # tag points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Same setup as ci.yml. `.node-version` is the single Node pin, so this
      # file must never carry a literal version (`pnpm check:node-version`).
      # No package-manager cache anywhere in this file: a restored cache is an
      # input an attacker can poison, and these jobs are the ones that publish.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # SECURITY.md, "Dependency and code-scanning findings": no release is
      # published while a high or critical advisory is open. security-audit.yml
      # catches one published after a merge, daily; these two catch one
      # published since its last run, before any tarball exists. The second
      # audits the lockfile the `publish` job installs from, which holds the
      # OIDC token; --package-lock-only needs no install. An advisory that does
      # not affect the project is excluded by GHSA id under `audit.ignore` in
      # pnpm-workspace.yaml, in a reviewed PR -- the only way past this step.
      - run: pnpm audit --audit-level=high
      - run: npm audit --package-lock-only --prefix tools/release --audit-level=high
      # The whole gate, then the end-to-end suite, before a tarball exists.
      # `pnpm verify` is one full run of every group, the same steps ci.yml
      # spreads across its lanes -- this is a single full run rather than a
      # per-lane invocation, so it deliberately does not name a group.
      # test:e2e includes the packed-tarball test: it packs the CLI, unpacks
      # it outside the repo and runs it, which is the only check that the
      # published artifact works.
      - run: pnpm verify
      - run: pnpm test:e2e
      # `pnpm pack` runs prepack (vendors templates/ and the plugin in) and
      # postpack, and needs `dist/`, so the build comes first. The tarball is
      # packed once, here, and every later job takes this exact file.
      - name: Pack the CLI
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm build
          mkdir release-assets
          pnpm --filter @monte3l/groundwork pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
          shopt -s nullglob
          tarballs=(release-assets/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected one tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          # release-please writes the version into package.json in the release
          # PR, so a mismatch means the PR and its release disagree.
          if [ "$(basename "${tarballs[0]}")" != "monte3l-groundwork-${VERSION}.tgz" ]; then
            echo "$(basename "${tarballs[0]}") is not monte3l-groundwork-${VERSION}.tgz" >&2
            exit 1
          fi
      # The CycloneDX SBOM (OSPS Baseline OSPS-QA-02.02) is made here, where
      # the lockfile is installed and no OIDC token exists; `publish` attests it.
      - name: Generate a CycloneDX SBOM for the tarball
        run: |
          # `pnpm --filter <name> sbom`, never `-C <dir>` or a cd into the
          # package: both silently describe the workspace root
          # (m3l-groundwork@0.0.0) instead of the published package.
          # --lockfile-only reads pnpm-lock.yaml and nothing else (no install,
          # no network); --prod is the shipped dependency set, which is empty,
          # so the SBOM holds the root component alone -- accurate, not a
          # defect.
          tarball="$(find release-assets -name '*.tgz' -print -quit)"
          # Named <tarball>.cdx.json, the OSSF SBOM Everywhere convention.
          pnpm --filter @monte3l/groundwork sbom \
            --sbom-format cyclonedx --sbom-spec-version 1.6 \
            --prod --lockfile-only \
            --sbom-authors "Enrico Lionello" --sbom-supplier "monte3l" \
            --out "${tarball}.cdx.json"
          # pnpm sbom does not hash the artifact, and CISA's 2026 minimum
          # elements ask for a component hash (algorithm and value) of the
          # executable artifact. Record the tarball's SHA-256 on the root
          # component here, before `publish` signs the file.
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const [sbomPath, tarballPath] = process.argv.slice(1);
            const bom = JSON.parse(fs.readFileSync(sbomPath, "utf8"));
            const digest = crypto
              .createHash("sha256")
              .update(fs.readFileSync(tarballPath))
              .digest("hex");
            bom.metadata.component.hashes = [{ alg: "SHA-256", content: digest }];
            fs.writeFileSync(sbomPath, JSON.stringify(bom, null, 2) + "\n");
          ' "${tarball}.cdx.json" "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [prepare, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gates the staged publish behind a required reviewer (see CLAUDE.md,
    # "Releases"). The draft release and its tag already exist at this point,
    # but a draft is visible to writers only, so nothing is public until
    # `finalize`. The environment (created once, by hand, via `gh api`) has no
    # branch restriction beyond `main` and no wait timer -- it exists to
    # require a person, not to add a delay.
    environment: npm-publish
    permissions:
      contents: write # gh release upload to the draft
      id-token: write # npm trusted publishing (OIDC), provenance and attestations
      attestations: write # actions/attest on the tarball and its SBOM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
          # OpenSSF Scorecard's Packaging check only recognises an npm publish
          # job by this exact registry-url next to a step that runs `npm ...
          # publish` (here, `npm-stage-publish.mjs`). Auth is not affected:
          # bin/npm-stage-publish.mjs never reads .npmrc or NODE_AUTH_TOKEN, it
          # exchanges the GitHub OIDC token itself and hands the result to
          # libnpmpublish as an explicit option.
          registry-url: https://registry.npmjs.org
      # Staged publishing goes through libnpmpublish (npm's own publish
      # library, bin/npm-stage-publish.mjs), not the npm CLI: every advisory
      # that blocked the CLI sat in packages bundled inside its tarball, out
      # of reach of overrides (docs/security-review.md). Pinned to exact
      # versions -- this job holds the OIDC token, and OpenSSF Scorecard's
      # Pinned-Dependencies check (scorecard.yml) flags any unpinned
      # package install the same way it flags an unpinned Action. A bare
      # `npm install` here would only pin the VERSION string; the committed
      # tools/release/package-lock.json pins every tarball by its
      # sha512 integrity hash, and `npm ci` verifies the install against it.
      # Dependabot has an npm entry for this directory (see dependabot.yml).
      - run: npm ci --ignore-scripts --prefix tools/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      # The draft's tag is made at the commit the release PR merged as. The
      # attestations name this run's commit, so a tag anywhere else means the
      # release and the build disagree, and nothing is attested or staged.
      # The tags ruleset blocks moving or deleting a tag, so the fix is a
      # maintainer's, see .claude/rules/releases.md.
      - name: Check that the release tag points at the commit that was built
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          # An annotated tag lists its peeled commit last; a lightweight tag has
          # one line. Anonymous read: the repository is public.
          tagged="$(git ls-remote "https://github.com/${REPOSITORY}.git" \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk 'END { print $1 }')"
          if [ -n "$tagged" ] && [ "$tagged" = "$BUILT_SHA" ]; then
            echo "tag ${TAG} points at the built commit ${BUILT_SHA}"
            exit 0
          fi
          echo "::error title=Release tag does not match the build::${TAG} points at '${tagged:-nothing}' but the tarball was built from ${BUILT_SHA}. See .claude/rules/releases.md."
          exit 1
      # OpenSSF Best Practices' `signed_releases` criterion is met by npm
      # provenance alone (a Sigstore-backed, OIDC-issued attestation with no
      # long-lived key -- see SECURITY.md, "Verifying releases"). These two
      # steps add a second, independent proof on the GitHub Release itself.
      # Nothing irreversible has happened yet, so they fail the job rather
      # than continue: a release with no attestation is not published.
      - name: Attest build provenance for the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # actions/attest-build-provenance's own glob support (not the
          # shell's), so `**` resolves correctly regardless of `globstar`.
          subject-path: release-assets/**/*.tgz
      - name: Attest the SBOM against the tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/**/*.tgz
          sbom-path: release-assets/*.cdx.json
      # The assets go on the draft BEFORE it is published, because an immutable
      # release locks them at publish. The Sigstore bundle is an asset because
      # OpenSSF Scorecard's Signed-Releases check only looks at release assets
      # (`*.sigstore.json` scores 8), never at GitHub's attestation store.
      # Verify it with `gh attestation verify <tgz> --bundle <tgz>.sigstore.json
      # -R <repo>`. The SBOM attestation's own bundle is deliberately not
      # uploaded: it would sit beside the provenance `.sigstore.json` and blur
      # what that name means to Scorecard. Verify the SBOM with
      # `gh attestation verify <tgz> -R <repo> --predicate-type
      # https://cyclonedx.org/bom`.
      - name: Attach the attested assets to the draft and read them back
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag_name }}
          ATTEST_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          tarball="$(find release-assets -name '*.tgz' -print -quit)"
          cp "$ATTEST_BUNDLE" "${tarball}.sigstore.json"
          assets=("$tarball" "${tarball}.sigstore.json" "${tarball}.cdx.json")
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          mkdir uploaded
          gh release download "$TAG" --dir uploaded --repo "$GITHUB_REPOSITORY"
          for asset in "${assets[@]}"; do
            cmp -- "$asset" "uploaded/$(basename -- "$asset")"
          done
      # Last, because it is the step that cannot be taken back: the version
      # exists on npm, staged, until a maintainer approves it.
      - name: Stage the package on npm
        env:
          RELEASE_TOOLS_DIR: ${{ github.workspace }}/tools/release
          STAGED_IDS_FILE: ${{ runner.temp }}/staged-ids.txt
        run: |
          tarball="$(find release-assets -name '*.tgz' -print -quit)"
          node bin/npm-stage-publish.mjs "$tarball" --access public --tag latest
      # The stage id to approve is printed here, plus an annotation on the run
      # page. `npm stage approve <id>` (2FA) is still a maintainer step.
      - name: Show the staged ids to approve
        if: always()
        env:
          STAGED_IDS_FILE: ${{ runner.temp }}/staged-ids.txt
        run: |
          if [ -s "$STAGED_IDS_FILE" ]; then
            while read -r id stage; do
              echo "staged $id with id $stage -- approve with: npm stage approve $stage"
              echo "::notice title=Staged $id::npm stage approve $stage"
              # Older versions are deprecated by hand AFTER the approval, not
              # here: a staged version is not installable until approved, and
              # the OIDC publisher cannot run `npm deprecate`. A stable
              # version only (no `-` prerelease suffix); `${id##*@}` is the
              # version of `<name>@<version>`.
              version="${id##*@}"
              case "$version" in
                *-*) ;;
                *)
                  echo "after approving, deprecate the older versions: node bin/deprecate-superseded.mjs --expect $version --apply"
                  echo "::notice title=Deprecate after approving $id::node bin/deprecate-superseded.mjs --expect $version --apply"
                  ;;
              esac
            done < "$STAGED_IDS_FILE"
          else
            echo "no staged version was recorded by this run"
          fi

  # Publishes the draft last, then dispatches to m3l-plugins so it opens the
  # pin pull request. The tarball and SBOM were attested by `publish`, so the
  # shared workflow only publishes.
  finalize:
    name: Finalize
    needs: [prepare, publish]
    if: needs.prepare.outputs.releases_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: monte3l/.github/.github/workflows/release-finalize.yml@4e2797a213e85b6dd24c3e729fe15385924fc091 # release-baseline
    with:
      tag: ${{ needs.prepare.outputs.tag_name }}
      attest: false
      notify: '["m3l-plugins"]'
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
