name: REUSE

# Checks that every file has a copyright and license declaration (REUSE.toml
# or an SPDX header) and that each license named has its text in LICENSES/.
# A repository that vendors m3l-design needs this: the design system ships
# OFL-1.1 fonts next to MIT files, and REUSE.toml is where that split is
# recorded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
