version: 2

updates:
  # Keeps the action majors in .github/workflows/ from going stale. GitHub
  # moves JS actions onto new Node runtimes on its own schedule, so a major
  # behind starts warning well before it breaks. npm updates are deliberately
  # not enabled here: a weekly PR per devDependency across this monorepo is
  # more churn than one maintainer wants. Add it later with `groups:`
  # batching.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # .github/release-tools/ pins the exact npm version the release
  # workflow's publish job installs (see release.yml's `npm ci --prefix`
  # step) via a committed package-lock.json's integrity hash, not a bare
  # version string in YAML -- so bumping that pin stays a normal reviewed
  # PR instead of a hand-regenerated lockfile. This package runs holding
  # the publish job's OIDC token, so it gets the same one-day cooldown
  # pnpm-workspace.yaml's minimumReleaseAge already holds every other
  # dependency to -- Dependabot's own cooldown default is 0.
  - package-ecosystem: "npm"
    directory: "/.github/release-tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # The `publishing` pack ships its own copy of release-tools/ to every
  # project it is installed into. Dependabot scans that copy as a manifest in
  # this repo anyway (it raises alerts for it), so it gets the same entry:
  # a patched npm then arrives as a PR here instead of only as an alert. A
  # merge touches shipped template files, so it needs a patch changeset for
  # `@monte3l/groundwork` added to the PR by hand -- the bot cannot add one.
  # The commit prefix is `fix(deps)`, not `ci`: unlike the root entry, a bump
  # here changes shipped output.
  - package-ecosystem: "npm"
    directory: "/templates/packs/publishing/files/.github/release-tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  # .github/deploy-tools/ pins the exact wrangler version docs.yml's deploy
  # job installs, the same lockfile-integrity-hash pattern as release-tools
  # above. Its job holds a Cloudflare API token (see docs/cloudflare-docs.md),
  # so it gets the same one-day cooldown.
  - package-ecosystem: "npm"
    directory: "/.github/deploy-tools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
