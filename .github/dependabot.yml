version: 2

updates:
  # Keeps the action majors in .github/workflows/ from going stale. GitHub
  # moves JS actions onto new Node runtimes on its own schedule, so a major
  # behind starts warning well before it breaks. npm updates are deliberately
  # not enabled here: a weekly PR per devDependency across this monorepo is
  # more churn than one maintainer wants. Add it later with `groups:`
  # batching.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Same week-long wait the org's other repositories use for action bumps;
    # a freshly published action version is the supply-chain window Dependabot's
    # default cooldown of 0 leaves open.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  # The workflows that templates/ ships into bootstrapped projects pin their
  # actions by SHA too, but they live outside .github/workflows/, so the entry
  # above never saw them and their pins went stale (scorecard-action and
  # claude-code-action were both behind the org's own templates). Dependabot
  # reads a non-root directory directly, one level of *.yml, and `directories`
  # takes a glob, so the three packs that ship workflows are one pattern.
  # If a scheduled run never opens a pull request for a stale pin here, the entry
  # does not work: fall back to Renovate scoped to these folders.
  #
  # One pull request for the lot, typed `fix(deps)` and not `ci`, as for the
  # publishing pack's tools below: a bump here changes shipped output, and
  # release-please turns a `fix` into a patch release, which is how a refreshed
  # pin reaches the next project that is bootstrapped. Grouped, so a week of
  # bumps is one release and not eight. A project that was already bootstrapped
  # keeps its own pins and its own Dependabot.
  - package-ecosystem: "github-actions"
    directories:
      - "/templates/core/.github/workflows"
      - "/templates/packs/*/files/.github/workflows"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    cooldown:
      default-days: 7
    groups:
      template-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # tools/release/ pins the exact libnpmpublish and
  # npm-registry-fetch versions the release workflow's publish job installs (see release.yml's `npm ci --prefix`
  # step) via a committed package-lock.json's integrity hash, not a bare
  # version string in YAML -- so bumping that pin stays a normal reviewed
  # PR instead of a hand-regenerated lockfile. This package runs holding
  # the publish job's OIDC token, so it gets the same one-day cooldown
  # pnpm-workspace.yaml's minimumReleaseAge already holds every other
  # dependency to -- Dependabot's own cooldown default is 0.
  - package-ecosystem: "npm"
    directory: "/tools/release"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # The `publishing` pack ships its own copy of release-tools/ to every
  # project it is installed into. Dependabot scans that copy as a manifest in
  # this repo anyway (it raises alerts for it), so it gets the same entry:
  # a patched npm then arrives as a PR here instead of only as an alert. A
  # merge touches shipped template files. The commit prefix is `fix(deps)`,
  # not `ci`: unlike the root entry, a bump here changes shipped output, and
  # release-please turns a `fix` into a patch release.
  - package-ecosystem: "npm"
    directory: "/templates/packs/publishing/files/tools/release"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "fix(deps)"
    labels:
      - "dependencies"

  # tools/deploy/ pins the exact wrangler version docs.yml's deploy
  # job installs, the same lockfile-integrity-hash pattern as release-tools
  # above. Its job holds a Cloudflare API token (see docs/cloudflare-docs.md),
  # so it gets the same one-day cooldown.
  - package-ecosystem: "npm"
    directory: "/tools/deploy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
