# Area labels for `.github/workflows/labeler.yml` (`actions/labeler`). One
# label per shipped artifact, so a PR list reads by area and a reviewer can
# filter to the one they care about. A PR that touches several areas gets
# several labels. The path scopes of the matching rules in `.claude/rules/`
# are the source for these globs; nothing checks that they agree, so update
# both when a scope moves.
#
# `area:ci`, `area:docs`, `area:design` and `area:harness` are shared labels
# defined in the org blueprint (`monte3l/.github`, `blueprint/labels.json`),
# so their globs here follow the org's shared rules. The others are specific
# to this repo and are created by hand with
# `gh label create <name> --color 554d50 --description ...`, because a label
# the action creates itself comes out in GitHub's default grey.

"area:cli":
  - changed-files:
      - any-glob-to-any-file: ["packages/cli/**"]

"area:plugin":
  - changed-files:
      - any-glob-to-any-file: ["packages/plugin/**", ".claude-plugin/**"]

"area:baseline":
  - changed-files:
      - any-glob-to-any-file: ["templates/core/**"]

"pack:claude-github":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/claude-github/**"]

"pack:frontend":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/frontend/**"]

"pack:github":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/github/**"]

"pack:harness-extras":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/harness-extras/**"]

"pack:licensing":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/licensing/**"]

"pack:publishing":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/publishing/**"]

"pack:quality":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/quality/**"]

"pack:service":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/service/**"]

"pack:statusline":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/statusline/**"]

"pack:supply-chain":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/supply-chain/**"]

"pack:worktrees":
  - changed-files:
      - any-glob-to-any-file: ["templates/packs/worktrees/**"]

"area:harness":
  - changed-files:
      - any-glob-to-any-file: [".claude/**"]

"area:ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "lefthook.yml", "bin/**"]

"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "*.md", "docs.config.mjs"]

"area:design":
  - changed-files:
      - any-glob-to-any-file: ["design/**"]
